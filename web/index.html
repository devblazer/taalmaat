<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Taalmaat</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Taalmaat</h1>
      <div id="crumb" class="crumb"></div>
      <div class="tools">
        <label class="size">
          <span>Text</span>
          <select id="size">
            <option value="small">Small</option>
            <option value="normal">Normal</option>
            <option value="large">Large</option>
            <option value="huge">Huge</option>
          </select>
        </label>
        <label class="mode">
          <span>Look</span>
          <select id="mode">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
        <div id="who" class="who"></div>
      </div>
    </header>

    <main id="main">
      <div class="loading">Loading…</div>
    </main>

    <div id="popup" class="popup" hidden>
      <button class="popup-close" aria-label="Close">×</button>
      <div id="popup-body"></div>
    </div>

    <div id="cover" class="cover" hidden>
      <div class="cover-inner">
        <div class="spinner"></div>
        <p id="cover-title" class="cover-title"></p>
        <p id="cover-sub" class="cover-sub"></p>
        <div id="cover-bar" class="bar" hidden><div id="cover-fill" class="bar-fill"></div></div>
      </div>
    </div>

    <script src="app.js" type="module"></script>
  </body>
</html>
